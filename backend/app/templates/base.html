<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Truy xuất rau sạch IoT" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">🌱 TraceVeg IoT</a>
    <nav>
        {% if active_node_info %}
        <span style="font-size: 13px; color: #166534; background: #dcfce7; padding: 5px 12px; border-radius: 20px; font-weight: 600; border: 1px solid #bbf7d0;">
            🔗 Kết nối: {{ active_node_info.name }}
        </span>
        {% else %}
        <span style="font-size: 13px; color: #991b1b; background: #fee2e2; padding: 5px 12px; border-radius: 20px; font-weight: 600; border: 1px solid #fecaca;">
            ⚠️ Mạng ngoại tuyến (Offline)
        </span>
        {% endif %}
        <a href="/">Dashboard</a>
        <a href="/blockchain">Blockchain Explorer</a>
        <a href="/batches/new">Tạo lô rau</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    MVP demo: ESP32 → FastAPI → QR Trace Page → Hash Verification
</footer>
</body>
</html>
