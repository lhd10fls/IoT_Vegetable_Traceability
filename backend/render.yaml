services:
  - type: web
    name: vegetable-traceability-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_BASE_URL
        sync: false          # Set this manually in Render dashboard after deploy
      - key: PYTHON_VERSION
        value: "3.11"
